# Deploy to Cloudflare.
#
# Manual for now — the repository owner enables the automatic triggers once CI
# is settled. Uncomment the `push` trigger below to deploy on every merge to
# main.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" + "D1 Edit"
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
#
# Order matters: the backend Worker deploys first, because the frontend's
# service binding resolves `atlas-api` by name and will fail if it does not
# exist yet.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which Cloudflare environment to deploy
        type: choice
        options: [production, preview]
        default: preview
        required: true
  # push:
  #   branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'preview' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The compiled atlas bundles and the maps are build artefacts, not
      # committed output, so they have to be regenerated before the export.
      - name: Build data and maps
        run: |
          npm run fetch-natural-earth
          npm run build-maps
          npm run build-atlas
          npm run build-package-cards

      - name: Build static export
        run: npm run build

      - name: Verify the export exists
        run: test -f out/index.html || (echo "out/ is empty — the export did not run" && exit 1)

      # D1 migrations are additive and idempotent (`CREATE TABLE IF NOT
      # EXISTS`), so re-running them on every deploy is safe.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: >-
            d1 migrations apply atlas --remote
            --env="${{ (inputs.environment || 'preview') == 'preview' && 'preview' || '' }}"

      - name: Deploy backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: >-
            deploy
            --env="${{ (inputs.environment || 'preview') == 'preview' && 'preview' || '' }}"

      - name: Deploy frontend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --env="${{ (inputs.environment || 'preview') == 'preview' && 'preview' || '' }}"
